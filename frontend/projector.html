<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MECH · Proyector</title>
<!-- Letras para coreano, japonés y chino, en local (la Raspberry Pi no las
     trae: los subtítulos y la trivia salían con cuadritos). Solo se cargan
     los trozos que hacen falta; en español, ninguno. -->
<link rel="stylesheet" href="/vendor/mech-fonts-cjk.css">
<!-- Sora y Space Mono, también en local: la pantalla de reposo y la tarjeta
     de la canción usan la misma letra que el panel. -->
<link rel="stylesheet" href="/vendor/mech-fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  /* Reposo: cuando no hay NADA que proyectar, en vez de la pantalla en negro
     salen las «bolitas» del panel (vista Inmersivo) y su rótulo. Van DEBAJO
     del escenario. Aparecen con un fundido y se quitan DE GOLPE: si se
     fundieran al salir, se verían un instante sobre el video que entra. */
  #reposo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; }
  #reposo-rotulo {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.6vh;
    text-align: center; pointer-events: none; opacity: 0;
    font-family: 'Sora', -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #reposo-rotulo h2 {
    font-size: clamp(20px, 2.9vw, 60px); font-weight: 700; color: #fff;
    letter-spacing: .22em; text-indent: .22em;
    text-shadow: 0 0 30px rgba(34, 211, 238, .8);
  }
  #reposo-rotulo p { font-size: clamp(12px, 1.5vw, 30px); color: rgba(255, 255, 255, .6); }
  body.en-reposo #reposo { opacity: 1; transition: opacity .8s ease; }
  body.en-reposo #reposo-rotulo { opacity: 1; transition: opacity .8s ease .3s; }
  /* Mientras MECH habla sin proyectar nada (una respuesta suelta), se quedan
     las bolitas pero no el «Esperando contenido…»: abajo van los subtítulos. */
  body.en-reposo #subs:not(:empty) ~ #reposo-rotulo { opacity: 0; transition: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img, #stage video {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: opacity 0.4s ease;
  }
  #idle {
    color: #222; font-family: 'Space Mono', monospace; font-size: 12px;
    letter-spacing: 3px; position: absolute; bottom: 16px; right: 20px;
  }
  /* Subtítulos estilo cine: abajo, centrados, con sombra fuerte para que se
     lean igual sobre video claro u oscuro. Se ocultan solos cuando quedan
     vacíos (:empty), así no hay que tocar clases desde el script. */
  #subs {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    width: 86%; max-width: 1700px;
    text-align: center; text-wrap: balance;
    /* `--cjk` = las Noto de coreano, japonés y chino (mech-fonts-cjk.css). */
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, var(--cjk, sans-serif), sans-serif;
    font-size: clamp(20px, 3.1vw, 46px);
    font-weight: 600; line-height: 1.28; letter-spacing: .2px;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9),
                 0 0 20px rgba(0,0,0,.65);
    opacity: 1; transition: opacity .25s ease;
    pointer-events: none;
  }
  #subs:empty { opacity: 0; }
  /* Aviso cuando el navegador bloquea el audio de la playlist promo: el
     video sigue viéndose (en silencio) y basta un toque para el sonido. */
  #audio-hint {
    display: none;
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px;
    background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.28);
    color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: clamp(13px, 1.5vw, 20px); letter-spacing: .3px;
    pointer-events: none; z-index: 10;
  }
  /* El navegador no deja sonar sin un toque (ver «comprobarSonido» abajo): el
     aviso se queda puesto, haya o no playlist, hasta que alguien toque. */
  body.sin-sonido #audio-hint { display: block !important; }
  /* Permite forzar fullscreen al hacer click. */
</style>
</head>
<body>
  <canvas id="reposo" aria-hidden="true"></canvas>
  <div id="stage"></div>
  <div id="subs"></div>
  <div id="reposo-rotulo"><h2>ESPACIO INMERSIVO</h2><p>Esperando contenido…</p></div>
  <div id="idle">MECH · STAND</div>

<script src="/static/subtitles.js"></script>
<script src="/static/trivia.js"></script>
<script src="/static/music.js?v=13"></script>
<script>
/* Pantalla de proyección fullscreen.
 *
 * Se suscribe al WebSocket del backend. Cuando llega un evento `image`
 * o `projector`, cambia la imagen/video mostrado.
 *
 * Para abrirla en la Raspberry Pi conectada al proyector:
 *   chromium-browser --kiosk http://localhost:8000/projector
 */

const stage = document.getElementById('stage');
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

/* Subtítulos del guion que narra MECH (en el idioma activo: español, o
   inglés si lo despertaron con "wake up MECH"). Si por lo que sea no cargó
   subtitles.js, el resto de la página sigue funcionando igual. */
const subs = window.MechSubs
  ? MechSubs.create([document.getElementById('subs')])
  : { set() {}, clear() {} };

/* Juego de preguntas (estilo Kahoot). Se pinta ENCIMA de todo lo demás (el
   video sigue detrás, pero tapado): el servidor manda qué toca ver en cada
   momento. Ver frontend/trivia.js y backend/trivia.py. */
const juego = window.MechTrivia
  ? MechTrivia.create(document.body)
  : { apply() {}, clear() {} };

/* Modo música: la canción que MECH pone suena AQUÍ (el video y, al lado, la
   tarjeta de la canción). Esta página avisa al servidor de cuándo empieza y
   cuándo termina. Ver frontend/music.js y backend/music.py. */
const musica = window.MechMusic
  ? MechMusic.create(document.body)
  : { apply() {}, clear() {}, sonido() {} };

/* ─── Reposo: las «bolitas» cuando no hay nada que proyectar ──────────
 *
 * Pedido del equipo (oct 2026): que la proyección no se quede en negro. Es
 * la misma animación de la vista Inmersivo del panel (frontend/app.js,
 * initImmDemo): 90 puntos que derivan y dejan estela, con el color respirando
 * alrededor del cian.
 *
 * - El lienzo es PEQUEÑO a propósito (720 px de ancho) y el navegador lo
 *   estira: así salen las bolitas suaves y grandes que se ven en el panel, y
 *   la Raspberry Pi casi no trabaja (pintar 1920×1080 en cada fotograma sí
 *   se notaría).
 * - Solo se anima mientras se ve: en cuanto entra un video, una imagen, la
 *   trivia o una canción, el bucle se para.
 */
(function () {
  const lienzo = document.getElementById('reposo');
  const ctx = lienzo.getContext('2d');
  const ANCHO = 720;
  let puntos = [];
  let fase = 0;
  let cuadro = 0;        // id del requestAnimationFrame en curso (0 = parado)

  function medir() {
    lienzo.width = ANCHO;
    lienzo.height = Math.max(1, Math.round(ANCHO * innerHeight / Math.max(1, innerWidth)));
    puntos = Array.from({ length: 90 }, () => ({
      x: Math.random() * lienzo.width, y: Math.random() * lienzo.height,
      r: Math.random() * 2 + 0.4,
      vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
      a: Math.random() * Math.PI * 2,
    }));
    ctx.fillStyle = '#060809';
    ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  }

  function dibujar() {
    cuadro = requestAnimationFrame(dibujar);
    ctx.fillStyle = 'rgba(6,8,9,0.18)';          // no borra del todo: deja la estela
    ctx.fillRect(0, 0, lienzo.width, lienzo.height);
    fase += 0.004;
    const tono = 190 + Math.sin(fase) * 22;
    for (const p of puntos) {
      p.x += p.vx; p.y += p.vy; p.a += 0.012;
      if (p.x < 0) p.x = lienzo.width;
      if (p.x > lienzo.width) p.x = 0;
      if (p.y < 0) p.y = lienzo.height;
      if (p.y > lienzo.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + Math.sin(p.a) * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${tono + p.x / lienzo.width * 36},80%,68%,0.85)`;
      ctx.fill();
    }
  }

  // «Libre» = el escenario vacío y ni la trivia ni la música en pantalla.
  function libre() {
    return !stage.firstElementChild && !document.querySelector('.mt-wrap.on, .mm-wrap.on');
  }

  function revisar() {
    const si = libre();
    document.body.classList.toggle('en-reposo', si);
    if (si && !cuadro) cuadro = requestAnimationFrame(dibujar);
    if (!si && cuadro) { cancelAnimationFrame(cuadro); cuadro = 0; }
  }

  // El escenario avisa al instante (entra o sale un video o una imagen). La
  // trivia y la música se pintan ENCIMA y son opacas: para ellas basta con
  // mirar cada segundo, solo para no animar lo que no se ve.
  new MutationObserver(revisar).observe(stage, { childList: true });
  setInterval(revisar, 1000);
  addEventListener('resize', medir);
  medir();
  revisar();
})();

let ws = null;

function show(url, isVideo) {
  stopPlaylist();
  stage.innerHTML = '';
  if (!url) { reportPlayback(null); return; }
  const el = document.createElement(isVideo ? 'video' : 'img');
  el.src = url;
  if (isVideo) { el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true; }
  stage.appendChild(el);
  reportPlayback(isVideo ? url : null);
}

function clear() { stopPlaylist(); stage.innerHTML = ''; reportPlayback(null); }

/* ─── Reporte de posición (para que el visor VR vaya sincronizado) ────
 *
 * Esta pantalla es la que va con el audio. El teléfono, al entrar a la vista
 * VR, empezaba el video DESDE CERO mientras el audio ya iba por la mitad.
 * Para evitarlo, aquí decimos cada pocos segundos por qué segundo vamos, y
 * el visor se engancha en ese punto.
 *
 * Se manda la posición, no una marca de reloj: los relojes del teléfono y de
 * la Pi no tienen por qué coincidir. El backend añade la antigüedad.
 */
let reportUrl = null;
let reportTimer = null;

function reportPlayback(url) {
  reportUrl = url;
  if (reportTimer) { clearInterval(reportTimer); reportTimer = null; }
  if (!url) { sendPlayback(null, 0); return; }
  sendPlayback(url, 0);
  reportTimer = setInterval(() => {
    const v = stage.querySelector('video');
    if (!v || !reportUrl) return;
    sendPlayback(reportUrl, v.currentTime || 0);
  }, 2000);
}

function sendPlayback(url, position) {
  const body = { url, position };
  if (pl) { body.slug = pl.slug; body.index = pl.i; }
  fetch('/api/playback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).catch(() => {});
}

/* ─── Playlist promo (marketing) ──────────────────────────────────────
 *
 * Es distinto a lo de arriba. Una obra normal es UN video corto en bucle
 * mientras MECH narra encima. Aquí los videos son largos (~90 s), se
 * reproducen ENTEROS, en fila, y CON SU PROPIO AUDIO — MECH se calla.
 *
 * El backend no sabe cuánto dura cada mp4, así que el ritmo lo lleva esta
 * página: avanza con el evento `ended` de cada <video> y, al terminar el
 * último, avisa con POST /api/playlist/ended.
 *
 * ⚠️ AUDIO: los navegadores no dejan reproducir CON SONIDO sin un gesto del
 * usuario. En la Pi hay que abrir Chromium así:
 *     chromium --kiosk --autoplay-policy=no-user-gesture-required  *              http://localhost:8000/projector
 * Si aun así lo bloquea, esta página lo detecta, sigue en silencio y muestra
 * un aviso; al tocar la pantalla se activa el sonido y vuelve a empezar el
 * video en curso.
 */
let pl = null;          // { slug, items, i }
let plTimer = null;     // temporizador de las imágenes intercaladas

const IMAGE_SECONDS = 8;   // cuánto se queda una imagen dentro de la playlist

function stopPlaylist() {
  if (plTimer) { clearTimeout(plTimer); plTimer = null; }
  pl = null;
  hideAudioHint();
}

function finishReporting() {
  if (reportTimer) { clearInterval(reportTimer); reportTimer = null; }
  reportUrl = null;
}

function startPlaylist(playlist) {
  stopPlaylist();
  stage.innerHTML = '';
  if (!playlist || !playlist.items || !playlist.items.length) return;
  pl = {
    slug: playlist.slug, items: playlist.items, i: 0,
    audio: playlist.audio !== false,
    reproducidos: 0,   // cuántos llegaron al final de verdad
    fallos: [],        // los que el navegador no pudo reproducir
  };
  playCurrent();
}

function playCurrent() {
  if (!pl) return;
  if (pl.i >= pl.items.length) { finishPlaylist(); return; }
  const item = pl.items[pl.i];
  stage.innerHTML = '';

  if (item.kind === 'image') {
    const img = document.createElement('img');
    img.src = item.url;
    stage.appendChild(img);
    reportPlayback(null);   // una imagen fija no hay que sincronizarla
    plTimer = setTimeout(nextInPlaylist, IMAGE_SECONDS * 1000);
    return;
  }

  const v = document.createElement('video');
  v.src = item.url;
  v.playsInline = true;
  v.loop = false;                 // se reproduce ENTERO, una vez
  v.muted = !pl.audio;            // con su propio audio
  v.volume = 1;

  // Cada elemento avanza UNA sola vez. Sin esto, un archivo que falla dispara
  // 'error' Y hace que play() rechace: se saltarían DOS videos de golpe.
  let avanzado = false;
  const avanzar = (motivo, detalle) => {
    if (avanzado) return;
    avanzado = true;
    if (motivo === 'error') {
      const cod = (v.error && v.error.code) || 0;
      pl.fallos.push({ url: item.url, code: cod, detalle: detalle || '' });
    } else {
      pl.reproducidos += 1;
    }
    nextInPlaylist();
  };

  v.addEventListener('ended', () => avanzar('ended'));
  // Si el archivo falta o el navegador no sabe decodificarlo (pasa con H.265
  // y otros codecs raros), no dejamos la pantalla colgada: saltamos al
  // siguiente PERO lo apuntamos, para poder decirlo en el panel. Antes esto
  // era silencioso y la playlist "terminaba" en milisegundos sin explicar
  // por qué.
  v.addEventListener('error', () => avanzar('error'));
  stage.appendChild(v);

  reportPlayback(item.url);
  v.play().then(hideAudioHint).catch(() => {
    // Bloqueado por la política de autoplay: seguimos en silencio para no
    // dejar la pantalla en negro, y avisamos de que se puede tocar.
    v.muted = true;
    showAudioHint();
    v.play().catch(() => avanzar('error', 'no se pudo reproducir'));
  });
}

function nextInPlaylist() {
  if (!pl) return;
  if (plTimer) { clearTimeout(plTimer); plTimer = null; }
  pl.i += 1;
  playCurrent();
}

function finishPlaylist() {
  const slug = pl ? pl.slug : null;
  const reproducidos = pl ? pl.reproducidos : 0;
  const fallos = pl ? pl.fallos : [];
  stopPlaylist();
  finishReporting();
  sendPlayback(null, 0);
  stage.innerHTML = '';
  // Avisamos al backend: es lo único que sabe cuándo terminó de verdad.
  // Le mandamos también CUÁNTOS se reprodujeron y cuáles fallaron, para que
  // el panel pueda decir "no se pudo reproducir ninguno" en vez de dar la
  // proyección por buena.
  fetch('/api/playlist/ended', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug, played: reproducidos, failed: fallos }),
  }).catch(() => {});
}

function showAudioHint() {
  let el = document.getElementById('audio-hint');
  if (!el) {
    el = document.createElement('div');
    el.id = 'audio-hint';
    el.textContent = 'Toca la pantalla para activar el sonido';
    document.body.appendChild(el);
  }
  el.style.display = 'block';
}

function hideAudioHint() {
  const el = document.getElementById('audio-hint');
  if (el) el.style.display = 'none';
}

/* ─── ¿Este navegador deja SONAR sin un toque? ────────────────────────
 *
 * Los navegadores no dejan arrancar nada CON SONIDO hasta que alguien toca la
 * página, salvo que se abran con --autoplay-policy=no-user-gesture-required
 * (lo llevan los iconos «Iniciar MECH» y «Proyectar MECH» de la Pi). Sin ese
 * permiso, el modo música y los videos de marketing salen MUDOS.
 *
 * Antes eso se descubría a media canción. Ahora se comprueba AL ABRIR la
 * página, intentando reproducir una décima de segundo de silencio: si el
 * navegador se niega, se pone el aviso «Toca la pantalla…» desde el primer
 * momento y se le dice al servidor, que lo apunta en el panel. Un solo toque
 * (o una tecla) lo arregla para todo lo que suene después.
 */
let sinSonido = false;
// Lo último que se supo: null = aún no se sabe, true = deja sonar, false = no.
// Se le repite al servidor cada vez que vuelve (ver `connect`): el equipo
// reinicia MECH con la proyección abierta, y esa línea del panel es la que
// dice por qué algo no suena.
let sonidoEstado = null;

function avisarSonido(permitido, como) {
  sonidoEstado = permitido;
  fetch('/api/projection/sound', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ allowed: permitido, how: como || '' }),
  }).catch(() => {});
}

function silencioWav() {
  // Una décima de segundo de silencio, hecha aquí mismo (sin archivos).
  const n = 800;
  const b = new DataView(new ArrayBuffer(44 + n));
  const letras = (o, t) => { for (let i = 0; i < t.length; i++) b.setUint8(o + i, t.charCodeAt(i)); };
  letras(0, 'RIFF'); b.setUint32(4, 36 + n, true); letras(8, 'WAVEfmt ');
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, 8000, true); b.setUint32(28, 8000, true);
  b.setUint16(32, 1, true); b.setUint16(34, 8, true);
  letras(36, 'data'); b.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
}

function comprobarSonido() {
  let intento;
  try { intento = new Audio(silencioWav()).play(); } catch (e) { return; }
  if (!intento || !intento.then) return;
  intento.then(() => avisarSonido(true, 'al abrir')).catch((e) => {
    // Solo cuenta el «no permitido»; cualquier otro fallo no es el permiso.
    if (!e || e.name !== 'NotAllowedError') return;
    sinSonido = true;
    document.body.classList.add('sin-sonido');
    showAudioHint();
    avisarSonido(false, 'al abrir');
  });
}

/* Alguien tocó la pantalla (o una tecla): desde ahora el navegador deja
   sonar. Si había una canción puesta sin sonido, se le da. */
function tocaron() {
  if (sinSonido) {
    sinSonido = false;
    document.body.classList.remove('sin-sonido');
    hideAudioHint();
    avisarSonido(true, 'con un toque');
  }
  musica.sonido();
}

function detectVideo(url) {
  return /\.(mp4|webm|mov|m4v)$/i.test(url || '');
}

function applyState(s) {
  subs.set(s.current_subtitle, s.subtitle_lang);
  juego.apply(s.trivia);
  musica.apply(s.music, false);   // el estado solo sabe PARAR la canción
  // La playlist promo (marketing) manda sobre todo lo demás.
  if (s.current_playlist) {
    // Si ya la estamos reproduciendo, no la reiniciamos (esto se llama en
    // cada `state`, y volver a empezar cortaría el video a la mitad).
    if (!pl || pl.slug !== s.current_playlist.slug) startPlaylist(s.current_playlist);
    return;
  }
  // Prioridad: video AI (biblioteca) > imagen AI > proyector inmersivo > stand 1 > stand 2
  if (s.current_video) { show(s.current_video, true); return; }
  if (s.current_image) { show(s.current_image, false); return; }
  const imm = s.projectors?.imm;
  if (imm?.on && imm.file) { show(imm.file, detectVideo(imm.file)); return; }
  const s1 = s.projectors?.s1;
  if (s1?.on && s1.file) { show(s1.file, detectVideo(s1.file)); return; }
  const s2 = s.projectors?.s2;
  if (s2?.on && s2.file) { show(s2.file, detectVideo(s2.file)); return; }
  clear();
}

let yaConecto = false;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    // Al volver el servidor (lo reiniciaron), se le repite cómo está el
    // sonido. La primera vez no: ya lo dijo `comprobarSonido`.
    if (yaConecto && sonidoEstado !== null) avisarSonido(sonidoEstado, 'al reconectar');
    yaConecto = true;
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') applyState(msg.state);
    else if (msg.type === 'image') {
      if (msg.url) show(msg.url, false);
      else clear();
    } else if (msg.type === 'video') {
      // Video pre-renderizado de la biblioteca (Opción B).
      if (msg.url) show(msg.url, true);
      else clear();
    } else if (msg.type === 'playlist') {
      // Playlist promo (marketing): videos enteros, en fila y con su audio.
      if (msg.playlist) startPlaylist(msg.playlist);
      else clear();
    } else if (msg.type === 'trivia') {
      // Pregunta, resultado o marcador del juego (ver backend/trivia.py).
      juego.apply(msg);
    } else if (msg.type === 'music') {
      // Modo música: empezar la canción (o callarla).
      musica.apply(msg, true);
    } else if (msg.type === 'subtitle') {
      // El guion del segmento que MECH está narrando (o null al terminar).
      subs.set(msg.text, msg.lang);
    } else if (msg.type === 'projector') {
      // Solicita el estado actualizado tras el cambio.
      fetch('/api/state').then(r => r.json()).then(applyState);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

// Click sobre la pantalla → fullscreen real (algunos browsers requieren gesto
// del usuario) y, de paso, activa el sonido si el navegador lo había
// bloqueado: ese click ES el gesto que estaba esperando.
document.body.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  tocaron();
  if (pl && pl.audio) {
    const v = stage.querySelector('video');
    if (v && v.muted) {
      v.muted = false;
      v.currentTime = 0;   // que no se pierdan los primeros segundos
      v.play().then(hideAudioHint).catch(() => {});
    }
  }
});

document.addEventListener('keydown', tocaron);
// Un toque DENTRO del video de YouTube también vale para el navegador, pero
// de ese no llega ningún clic a esta página: se mira de vez en cuando.
setInterval(() => {
  if (sinSonido && navigator.userActivation && navigator.userActivation.hasBeenActive) tocaron();
}, 1000);

comprobarSonido();
connect();
</script>
</body>
