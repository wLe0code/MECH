<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MECH · Proyección VR (Cardboard)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
               font-family: 'Space Mono', monospace; -webkit-user-select: none; user-select: none; }

  /* Dos "ojos" lado a lado. Cada uno muestra la MISMA imagen/video (elementos
     DOM directos, igual que /projector — es lo que funciona en móvil). Al
     meter el teléfono en el Cardboard, cada lente ve un ojo. */
  #eyes { position: fixed; inset: 0; display: flex; }
  .eye { position: relative; width: 50%; height: 100%; overflow: hidden; background: #000; }
  .eye .content {
    position: absolute; inset: 0;
    transform-origin: center center;
    /* separación (translateX) y zoom (scale) los pone el script */
  }
  .eye .content img, .eye .content video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #eyes::after {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; transform: translateX(-1px); background: #111; pointer-events: none;
  }
  .idle {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: #2a2a33; font-size: 13px; letter-spacing: 4px; text-align: center;
    pointer-events: none;
  }
  .idle.hidden { display: none; }
  .idle .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid #1c1c26; border-top-color: #534AB7;
    animation: spin 2.4s linear infinite;
  }
  .idle-status { color: #4a5a7a; font-size: 10px; letter-spacing: 1px; max-width: 80%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #rotate {
    position: fixed; inset: 0; display: none; z-index: 10;
    background: #000; color: #888; font-size: 13px;
    letter-spacing: 2px; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #rotate .phone { font-size: 42px; animation: tilt 1.6s ease-in-out infinite alternate; }
  @keyframes tilt { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }

  #hint {
    position: fixed; bottom: 12px; left: 0; right: 0; z-index: 5;
    text-align: center; color: #444; font-size: 11px; letter-spacing: 2px;
    transition: opacity .5s;
  }
  #status {
    position: fixed; bottom: 30px; left: 0; right: 0; z-index: 5;
    text-align: center; color: #556; font-size: 10px; letter-spacing: 1px;
  }

  /* Panel de calibración (separación + zoom). */
  #calib {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 8px; align-items: center;
    background: rgba(14,14,18,0.92); border: 1px solid #26262e; border-radius: 12px;
    padding: 7px 10px; color: #cfcfe0; font-size: 12px; letter-spacing: 1px;
  }
  #calib.hidden { display: none; }
  #calib .grp { display: flex; align-items: center; gap: 4px; }
  #calib .lbl { color: #7a7a8c; font-size: 10px; }
  #calib button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid #33333f;
    background: #1a1a22; color: #e6e6f0; font-size: 16px; line-height: 1; font-family: inherit;
  }
  #calib button:active { background: #534AB7; }
  #calib .val { min-width: 34px; text-align: center; color: #8f97c4; }
  #calib .done { width: auto; padding: 0 12px; border-color: #3a5; color: #9fe0b8; }
  #calibToggle {
    position: fixed; top: 8px; right: 10px; z-index: 20;
    background: rgba(14,14,18,0.85); border: 1px solid #26262e; border-radius: 10px;
    color: #6a6a7c; font-size: 11px; letter-spacing: 1px; padding: 8px 10px; font-family: inherit;
  }
</style>
</head>
<body>
  <div id="eyes">
    <div class="eye" id="eyeL"><div class="content" id="contentL"></div><div class="idle" id="idleL"><div class="ring"></div>MECH · VR<div class="idle-status" id="idleStatusL">iniciando…</div></div></div>
    <div class="eye" id="eyeR"><div class="content" id="contentR"></div><div class="idle" id="idleR"><div class="ring"></div>MECH · VR<div class="idle-status" id="idleStatusR">iniciando…</div></div></div>
  </div>

  <div id="rotate"><div class="phone">📱</div>GIRA EL TELÉFONO<br>Y MÉTELO EN EL CARDBOARD</div>

  <div id="calib" class="hidden">
    <div class="grp"><span class="lbl">SEPARACIÓN</span>
      <button data-act="sep-">−</button><span class="val" id="sepVal">0</span><button data-act="sep+">+</button>
    </div>
    <div class="grp"><span class="lbl">ZOOM</span>
      <button data-act="zoom-">−</button><span class="val" id="zoomVal">100</span><button data-act="zoom+">+</button>
    </div>
    <button class="done" data-act="done">LISTO</button>
  </div>
  <button id="calibToggle">AJUSTAR VR</button>

  <div id="hint">TOCA EL CENTRO PARA PANTALLA COMPLETA · «AJUSTAR VR» PARA CALIBRAR</div>
  <div id="status">iniciando…</div>

<script>
/* MECH · Proyección estéreo para Google Cardboard.
 *
 * Abrir EN EL TELÉFONO (misma wifi que la Pi):
 *     http://<ip-de-la-pi>:8000/proyector/vr
 *
 * Render por ELEMENTOS DOM (img/video) duplicados por ojo — es exactamente
 * lo que usa /projector, que funciona en móvil. (La versión con <canvas>
 * no pintaba en algunos teléfonos.) Para las imágenes, dos <img> no
 * parpadean; para video se re-sincronizan los dos <video> cada 3 s.
 *
 * SEPARACIÓN y ZOOM (guardados en el teléfono) corrigen el "se ve doble":
 * se ajustan a mano una vez mirando por el visor. Estéreo "plano" (sin
 * corrección de distorsión). El QR del visor solo lo usan apps con SDK de
 * Cardboard; WebXR (que sí lo usaría) exige HTTPS y la Pi sirve por HTTP.
 */

const contentL = document.getElementById('contentL');
const contentR = document.getElementById('contentR');
const idleL = document.getElementById('idleL');
const idleR = document.getElementById('idleR');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

let sep = parseInt(localStorage.getItem('mech_vr_sep') || '0', 10);
let zoom = parseInt(localStorage.getItem('mech_vr_zoom') || '100', 10);

function applyCalib() {
  const z = zoom / 100;
  contentL.style.transform = `translateX(${sep}px) scale(${z})`;
  contentR.style.transform = `translateX(${-sep}px) scale(${z})`;
  document.getElementById('sepVal').textContent = sep;
  document.getElementById('zoomVal').textContent = zoom;
}
function saveCalib() {
  localStorage.setItem('mech_vr_sep', String(sep));
  localStorage.setItem('mech_vr_zoom', String(zoom));
  applyCalib();
}

let syncTimer = null;
let currentUrl = null;

function detectVideo(url) { return /\.(mp4|webm|mov|m4v)$/i.test(url || ''); }
function setIdle(on) { idleL.classList.toggle('hidden', !on); idleR.classList.toggle('hidden', !on); }
function setStatus(t) {
  if (statusEl) statusEl.textContent = t;
  // También en la pantalla de carga, para que se vea sin buscar.
  const a = document.getElementById('idleStatusL'), b = document.getElementById('idleStatusR');
  if (a) a.textContent = t;
  if (b) b.textContent = t;
}

function makeEl(url, isVideo) {
  const el = document.createElement(isVideo ? 'video' : 'img');
  el.src = url;
  if (isVideo) { el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true; el.setAttribute('playsinline', ''); }
  return el;
}

function clearMedia() {
  clearInterval(syncTimer);
  currentUrl = null;
  contentL.innerHTML = '';
  contentR.innerHTML = '';
  setIdle(true);
}

function show(url, isVideo) {
  if (!url) { clearMedia(); return; }
  setIdle(false);              // aunque ya lo mostremos, nunca dejes el idle encima
  if (url === currentUrl) return;  // ya mostrando esto
  clearInterval(syncTimer);
  currentUrl = url;
  contentL.innerHTML = '';
  contentR.innerHTML = '';
  const l = makeEl(url, isVideo);
  const r = makeEl(url, isVideo);
  contentL.appendChild(l);
  contentR.appendChild(r);
  setIdle(false);
  setStatus((isVideo ? 'video: ' : 'imagen: ') + url);
  if (isVideo) {
    l.play().catch(() => {}); r.play().catch(() => {});
    syncTimer = setInterval(() => {
      if (Math.abs((l.currentTime || 0) - (r.currentTime || 0)) > 0.15) r.currentTime = l.currentTime;
    }, 3000);
  }
}

function applyState(s) {
  if (s.current_video) { show(s.current_video, true); return; }
  if (s.current_image) { show(s.current_image, false); return; }
  const imm = s.projectors?.imm;
  if (imm?.on && imm.file) { show(imm.file, detectVideo(imm.file)); return; }
  const s1 = s.projectors?.s1;
  if (s1?.on && s1.file) { show(s1.file, detectVideo(s1.file)); return; }
  const s2 = s.projectors?.s2;
  if (s2?.on && s2.file) { show(s2.file, detectVideo(s2.file)); return; }
  clearMedia();
}

// ── Conexión: WebSocket para tiempo real + SONDEO HTTP de respaldo ──
// El sondeo (fetch /api/state cada 1.5 s) hace que la VR muestre lo mismo
// que /projector AUNQUE el WebSocket no conecte en el teléfono (que era el
// caso: la página cargaba pero no llegaba el contenido). El WS solo acelera
// las actualizaciones; el sondeo garantiza que siempre haya imagen.
let ws = null;
let wsOk = false;

function pollState() {
  fetch('/api/state', { cache: 'no-store' })
    .then(r => r.json())
    .then(s => { if (!wsOk) setStatus('conectado (HTTP) · esperando proyección…'); applyState(s); })
    .catch(() => { if (!wsOk) setStatus('sin conexión con el servidor…'); });
}

function connect() {
  setStatus('conectando al servidor…');
  try { ws = new WebSocket(WS_URL); }
  catch (e) { setTimeout(connect, 3000); return; }
  ws.onopen = () => { wsOk = true; setStatus('conectado · esperando proyección…'); pollState(); };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (msg.type === 'state') applyState(msg.state);
    else if (msg.type === 'image') { msg.url ? show(msg.url, false) : clearMedia(); }
    else if (msg.type === 'video') { msg.url ? show(msg.url, true) : clearMedia(); }
    else if (msg.type === 'projector') { pollState(); }
  };
  ws.onclose = () => { wsOk = false; setTimeout(connect, 2000); };
  ws.onerror = () => { wsOk = false; };
}

// Sondeo de respaldo SIEMPRE activo (barato: un GET de JSON pequeño).
pollState();
setInterval(pollState, 1500);

// ── Mantener la pantalla encendida ────────────────────────────────
let wakeLock = null, awakeVideo = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); return; }
  } catch (e) { /* plan B */ }
  if (awakeVideo) { awakeVideo.play().catch(() => {}); return; }
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const cx = c.getContext('2d');
  setInterval(() => {
    cx.fillStyle = '#000'; cx.fillRect(0, 0, 32, 32);
    cx.fillStyle = (Date.now() / 1000 | 0) % 2 ? '#010101' : '#000'; cx.fillRect(0, 0, 1, 1);
  }, 1000);
  awakeVideo = document.createElement('video');
  awakeVideo.srcObject = c.captureStream(1);
  awakeVideo.muted = true; awakeVideo.playsInline = true;
  awakeVideo.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
  document.body.appendChild(awakeVideo);
  awakeVideo.play().catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (wakeLock || awakeVideo)) keepAwake();
});

// ── Calibración ───────────────────────────────────────────────────
const calib = document.getElementById('calib');
document.getElementById('calibToggle').addEventListener('click', (ev) => {
  ev.stopPropagation(); calib.classList.toggle('hidden');
});
calib.addEventListener('click', (ev) => {
  ev.stopPropagation();
  const act = ev.target.getAttribute('data-act');
  if (!act) return;
  if (act === 'sep+') sep = Math.min(sep + 4, 400);
  else if (act === 'sep-') sep = Math.max(sep - 4, -400);
  else if (act === 'zoom+') zoom = Math.min(zoom + 5, 250);
  else if (act === 'zoom-') zoom = Math.max(zoom - 5, 40);
  else if (act === 'done') calib.classList.add('hidden');
  saveCalib();
});

// ── Entrar en modo visor ──────────────────────────────────────────
document.body.addEventListener('click', async () => {
  hint.style.opacity = '0';
  if (!document.fullscreenElement) {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
  }
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  keepAwake();
  document.querySelectorAll('video').forEach(v => v.play().catch(() => {}));
});

// Init
applyCalib();
setIdle(true);
connect();
</script>
</body>
</html>
