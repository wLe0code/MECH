<svg xmlns="http://www.w3.org/2000/svg" viewBox="236 -30 1188 1660" role="img" aria-label="MECH-3, la mascota del equipo">
  <!-- MECH-3 animado: la MASCOTA de la web. Mismas formas que el render 2D
       del stand (branding/scripts/render_2d_mech3.py) + los brazos del
       render 3D (bloques blancos con mano de mitón). Cada pieza que se mueve
       tiene su clase m3-*:
         m3-flota   todo el robot (flota / da pasos)
         m3-cabeza  cabeza y cuello (gira un poco al buscar)
         m3-brazo-d brazo derecho del robot (a la IZQUIERDA de quien mira):
                    el que saluda, como el robot de verdad
         m3-brazo-i brazo izquierdo del robot (a la derecha): el que señala
       Aquí dentro solo va la animación de reposo, que también funciona como
       <img>. Las poses (saluda, camina, señala, busca) las pone la web con
       data-pose cuando main.js mete este SVG dentro de la página
       (web/css/styles.css, «LA MASCOTA»). Todo se apaga con «reducir
       movimiento». El logo usa los trazos de scripts/mklogo.py. -->
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2028"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="brazo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfdcda"/>
      <stop offset=".35" stop-color="#f4faf9"/>
      <stop offset="1" stop-color="#dfeae8"/>
    </linearGradient>
    <radialGradient id="lente" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#3a8bd6"/>
      <stop offset=".35" stop-color="#132a44"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <radialGradient id="brillo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="estampado" width="46" height="46" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff4f4" stroke-opacity=".7" stroke-width="2.2">
        <circle cx="9" cy="10" r="5"/>
        <circle cx="32" cy="27" r="7"/>
        <path d="M20 40a9 9 0 0 1 14-6"/>
        <circle cx="40" cy="6" r="3"/>
        <path d="M4 30a8 8 0 0 0 9 8"/>
        <path d="M24 8c6 0 8 6 4 10s-9 2-8-3"/>
      </g>
    </pattern>
    <clipPath id="ojo-recorte">
      <rect x="440" y="100" width="300" height="236"/>
    </clipPath>
  </defs>

  <style>
    .m3-flota { animation: m3-flota 6s ease-in-out infinite; }
    .m3-sombra { transform-box: fill-box; transform-origin: center; animation: m3-sombra 6s ease-in-out infinite; }
    .m3-parpado { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: m3-parpadeo 5.5s ease-in-out infinite; }
    .m3-ceja { animation: m3-ceja 5.5s ease-in-out infinite; }
    .m3-guino { animation: m3-guino 7s ease-in-out infinite; }
    .m3-resplandor { animation: m3-lente 3.2s ease-in-out infinite; }
    .m3-led { animation: m3-led 2.4s ease-in-out infinite; }
    .m3-panuelo-i { transform-box: fill-box; transform-origin: 70% 0%; animation: m3-mece 4.6s ease-in-out infinite; }
    .m3-panuelo-d { transform-box: fill-box; transform-origin: 30% 0%; animation: m3-mece 4.6s ease-in-out infinite reverse; }
    .m3-halo { transform-box: fill-box; transform-origin: center; animation: m3-halo 6s ease-in-out infinite; }
    .m3-cabeza { transform-box: fill-box; transform-origin: 50% 100%; }
    /* el pivote de cada brazo es el círculo del hombro */
    .m3-brazo-d, .m3-brazo-i { transform-box: fill-box; transform-origin: 50% 7%; }
    .m3-brazo-d { transform-origin: 50% 5%; }
    .m3-brazo-d { animation: m3-reposo-d 6s ease-in-out infinite; }
    .m3-brazo-i { animation: m3-reposo-i 6s ease-in-out infinite; }
    @keyframes m3-flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes m3-sombra { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.9); opacity: .7; } }
    @keyframes m3-parpadeo { 0%, 90%, 100% { transform: scaleY(0); } 94% { transform: scaleY(1); } }
    @keyframes m3-ceja { 0%, 89%, 100% { transform: translateY(0); } 93% { transform: translateY(-9px); } }
    @keyframes m3-guino { 0%, 70%, 100% { transform: translateY(0); } 76% { transform: translateY(-7px); } 82% { transform: translateY(0); } }
    @keyframes m3-lente { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes m3-led { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes m3-mece { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.8deg); } }
    @keyframes m3-halo { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes m3-reposo-d { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @keyframes m3-reposo-i { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .m3-flota, .m3-sombra, .m3-parpado, .m3-ceja, .m3-guino, .m3-resplandor, .m3-led,
      .m3-panuelo-i, .m3-panuelo-d, .m3-halo, .m3-brazo-d, .m3-brazo-i { animation: none; }
      .m3-resplandor { opacity: .6; }
    }
  </style>

  <!-- halo azul detrás (encaja con la web) -->
  <ellipse class="m3-halo" cx="830" cy="760" rx="540" ry="640" fill="url(#halo)"/>

  <!-- sombra en el suelo -->
  <ellipse class="m3-sombra" cx="830" cy="1580" rx="440" ry="42" fill="url(#sombra)"/>

  <g class="m3-flota">
    <!-- ruedas -->
    <ellipse cx="620" cy="1505" rx="100" ry="62" fill="#0b0c10" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <ellipse cx="1040" cy="1505" rx="100" ry="62" fill="#0b0c10" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>

    <!-- cuerpo -->
    <rect x="386" y="612" width="872" height="878" rx="4" fill="url(#cuerpo)"/>
    <rect x="386" y="612" width="872" height="878" rx="4" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-width="2.5"/>

    <!-- franja de la bandera de Costa Rica -->
    <rect x="386" y="1400" width="872" height="10" fill="#161e5c"/>
    <rect x="386" y="1410" width="872" height="14" fill="#eeeef2"/>
    <rect x="386" y="1424" width="872" height="26" fill="#ce262c"/>
    <rect x="386" y="1450" width="872" height="14" fill="#eeeef2"/>
    <rect x="386" y="1464" width="872" height="12" fill="#161e5c"/>

    <!-- logo MECH en el pecho (marco inclinado + letras como trazos) -->
    <g transform="translate(1104 1337) scale(.96)" fill="#eeeef2">
      <g transform="skewX(-8)">
        <rect x="-132" y="-48" width="264" height="96" rx="22" fill="none" stroke="#eeeef2" stroke-width="9"/>
      </g>
      <path transform="translate(-5.47,0)" d="M-93.96 21.9 -83.01 -21.9H-67.53L-64.3 1.2H-63.1L-48.39 -21.9H-32.61L-43.56 21.9H-54.6L-45.25 -15.48L-43.54 -15.36L-61.93 13.08H-72.07L-76.3 -15.36L-74.41 -15.48L-83.76 21.9ZM-32.68 21.9 -21.73 -21.9H-10.93L-21.88 21.9ZM-23.08 21.9 -20.8 12.78H-2.32L-4.6 21.9ZM-18.65 4.2 -16.37 -4.92H0.85L-1.43 4.2ZM-14.41 -12.78 -12.13 -21.9H5.99L3.71 -12.78ZM25 23.1Q19.06 23.1 15.32 21.03Q11.58 18.96 9.66 15.57Q7.75 12.18 7.42 8.22Q7.09 4.26 8.02 0.54L8.35 -0.78Q9.39 -4.92 11.73 -8.91Q14.08 -12.9 17.68 -16.14Q21.28 -19.38 25.96 -21.3Q30.64 -23.22 36.28 -23.22Q42.28 -23.22 46.37 -20.97Q50.46 -18.72 52.26 -14.67Q54.07 -10.62 53.22 -5.28H42.06Q42.21 -7.56 41.25 -9.24Q40.29 -10.92 38.36 -11.85Q36.43 -12.78 33.67 -12.78Q31.09 -12.78 28.8 -11.88Q26.5 -10.98 24.68 -9.33Q22.86 -7.68 21.52 -5.34Q20.19 -3 19.45 -0.06Q18.72 2.88 18.88 5.22Q19.05 7.56 20.1 9.24Q21.15 10.92 23.03 11.79Q24.91 12.66 27.61 12.66Q31.81 12.66 35.23 10.62Q38.65 8.58 40.11 5.16H51.27Q49.5 10.08 45.72 14.16Q41.94 18.24 36.65 20.67Q31.36 23.1 25 23.1ZM82.8 21.9 93.75 -21.9H104.91L93.96 21.9ZM54.96 21.9 65.91 -21.9H77.07L66.12 21.9ZM68.5 4.68 70.94 -5.04H91.45L89.03 4.68Z"/>
    </g>

    <!-- pañuelo rojo (dos puntas que se mecen + nudo) -->
    <g>
      <polygon class="m3-panuelo-i" points="612,616 736,616 784,690 604,930 566,920" fill="#c42026"/>
      <polygon class="m3-panuelo-i" points="612,616 736,616 784,690 604,930 566,920" fill="url(#estampado)"/>
      <polygon class="m3-panuelo-d" points="896,616 1022,616 1068,920 1030,930 846,690" fill="#c42026"/>
      <polygon class="m3-panuelo-d" points="896,616 1022,616 1068,920 1030,930 846,690" fill="url(#estampado)"/>
      <polygon points="736,616 896,616 846,690 784,690" fill="#a81a20"/>
    </g>

    <!-- botones -->
    <circle cx="835" cy="740" r="18" fill="#eeeef2"/>
    <circle cx="835" cy="800" r="18" fill="#eeeef2"/>

    <!-- plataforma de hombros -->
    <polygon points="430,540 1214,540 1270,612 374,612" fill="#e2eeec"/>
    <rect x="374" y="604" width="896" height="18" fill="#b2c8c5"/>
    <polygon points="430,540 1214,540 1226,556 418,556" fill="#f4faf9"/>

    <!-- brazo DERECHO del robot (a la izquierda de quien mira): el que
         saluda. Bloque blanco + mano de mitón + pañuelo atado, como en las
         fotos de MECH-3 y MECH-4. Pivote: el círculo del hombro. -->
    <g class="m3-brazo-d">
      <rect x="262" y="640" width="110" height="380" rx="14" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <rect x="262" y="640" width="20" height="380" rx="10" fill="#b9cbc8" fill-opacity=".7"/>
      <!-- mano: dedos y pulgar más corto -->
      <rect x="292" y="1004" width="80" height="124" rx="14" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <rect x="262" y="1004" width="28" height="84" rx="10" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <!-- pañuelo costarricense atado en la muñeca: medio grande, como en
           las fotos, con dos puntas que caen por debajo de la mano -->
      <polygon points="248,984 322,984 304,1334 226,1296" fill="#c42026"/>
      <polygon points="248,984 322,984 304,1334 226,1296" fill="url(#estampado)"/>
      <polygon points="296,984 388,984 410,1262 336,1300" fill="#b81d23"/>
      <polygon points="296,984 388,984 410,1262 336,1300" fill="url(#estampado)"/>
      <path d="M286 1000 L272 1300 M354 1000 L372 1270" stroke="#7d1116" stroke-opacity=".45" stroke-width="4" fill="none"/>
      <rect x="250" y="948" width="134" height="46" rx="11" fill="#c42026"/>
      <rect x="250" y="948" width="134" height="46" rx="11" fill="url(#estampado)"/>
      <ellipse cx="320" cy="988" rx="36" ry="27" fill="#a81a20"/>
      <!-- hombro (pivote) -->
      <circle cx="317" cy="674" r="20" fill="#0b0c10" stroke="#22d3ee" stroke-opacity=".5" stroke-width="3"/>
    </g>

    <!-- brazo IZQUIERDO del robot (a la derecha de quien mira): el que señala -->
    <g class="m3-brazo-i">
      <rect x="1288" y="640" width="110" height="380" rx="14" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <rect x="1378" y="640" width="20" height="380" rx="10" fill="#b9cbc8" fill-opacity=".7"/>
      <rect x="1288" y="1004" width="80" height="124" rx="14" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <rect x="1370" y="1004" width="28" height="84" rx="10" fill="url(#brazo)" stroke="#9fb4b1" stroke-width="2"/>
      <circle cx="1343" cy="674" r="20" fill="#0b0c10" stroke="#22d3ee" stroke-opacity=".5" stroke-width="3"/>
    </g>

    <!-- cabeza y cuello (giran juntos al «buscar») -->
    <g class="m3-cabeza">
      <rect x="676" y="426" width="310" height="149" fill="#e2eeec"/>
      <rect x="676" y="426" width="24" height="149" fill="#f4faf9"/>

      <!-- tapa blanca y frente negro -->
      <rect x="386" y="10" width="888" height="140" rx="34" fill="#f4faf9" stroke="#0b0c10" stroke-width="6"/>
      <rect x="386" y="44" width="888" height="390" rx="34" fill="url(#cara)"/>
      <rect x="386" y="44" width="888" height="390" rx="34" fill="none" stroke="#22d3ee" stroke-opacity=".3" stroke-width="2.5"/>

      <!-- ojo grande = la lente del proyector (anillo blanco con el borde de abajo recto) -->
      <g clip-path="url(#ojo-recorte)">
        <circle cx="590" cy="245" r="130" fill="#eeeef2"/>
      </g>
      <circle cx="586" cy="241" r="60" fill="url(#lente)"/>
      <circle class="m3-resplandor" cx="586" cy="241" r="56" fill="url(#brillo)"/>
      <circle cx="566" cy="221" r="10" fill="#c9e9ff" fill-opacity=".85"/>
      <!-- párpado: baja un instante cada pocos segundos -->
      <rect class="m3-parpado" x="452" y="112" width="276" height="226" fill="#0e1015"/>
      <!-- ceja izquierda (media luna inclinada) -->
      <g class="m3-ceja">
        <path d="M484 134 Q556 62 650 118 Q560 92 492 150 Z" fill="#eeeef2"/>
      </g>

      <!-- guiño: ceja derecha + webcam -->
      <g class="m3-guino">
        <path d="M1005 132 Q1088 70 1172 132 Q1088 112 1005 132 Z" fill="#eeeef2"/>
      </g>
      <rect x="986" y="170" width="216" height="98" rx="22" fill="#141418" stroke="#5a5a64" stroke-width="3"/>
      <rect x="996" y="180" width="196" height="78" rx="16" fill="#08080a"/>
      <circle cx="1092" cy="219" r="34" fill="#28282e"/>
      <circle cx="1092" cy="219" r="22" fill="#0a0c12"/>
      <circle cx="1084" cy="212" r="6" fill="#7882aa"/>
      <circle class="m3-led" cx="1166" cy="198" r="6" fill="#22d3ee"/>

      <!-- sonrisa -->
      <path d="M772 350 A60 58 0 0 0 892 350 Z" fill="#eeeef2"/>
    </g>
  </g>
</svg>
